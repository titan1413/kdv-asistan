<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Girişi | 3065 KDV İade Asistanı</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal-active { display: flex !important; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-white/20">
        <div class="p-8">
            <div class="text-center mb-10">
                <img src="/KDV_Web/assets/logo.png" alt="3065.COM.TR" class="h-[140px] w-auto mx-auto object-contain">
                <p class="text-slate-500 mt-2 font-medium">Panel Girişi</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 ml-1 uppercase tracking-wider">E-Posta Adresi</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-envelope absolute left-4 text-slate-400"></i>
                        <input type="email" id="loginEmail" required 
                            class="w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50/50" 
                            placeholder="eposta@adresiniz.com">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1 ml-1">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Şifre</label>
                        <button type="button" onclick="openForgotModal()" class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition">Şifremi Unuttum?</button>
                    </div>
                    <div class="relative flex items-center">
                        <i class="fas fa-lock absolute left-4 text-slate-400"></i>
                        <input type="password" id="loginPassword" required 
                            class="w-full pl-11 pr-12 py-3.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-slate-50/50" 
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword('loginPassword')" class="absolute right-4 text-slate-400 hover:text-slate-600 transition">
                            <i id="eye-loginPassword" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                    <label for="rememberMe" class="ml-2 text-sm text-slate-500 cursor-pointer select-none">Beni Hatırla</label>
                </div>

                <button type="submit" id="loginBtn" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition duration-300 transform active:scale-95 shadow-xl shadow-blue-500/20">
                    Sisteme Giriş Yap
                </button>
            </form>


        </div>
        <div class="bg-slate-50/80 py-4 text-center border-t border-slate-100">
            <p id="loginMessage" class="text-sm font-medium"></p>
        </div>
    </div>

    <div id="forgotModal" class="hidden fixed inset-0 z-50 items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden transform transition-all">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">
                    <i class="fas fa-key"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800">Şifre Sıfırlama</h3>
                <p class="text-slate-500 mt-2 text-sm">Hesabınıza ait e-posta adresini girdiğinizde size bir bağlantı göndereceğiz.</p>
                
                <div class="mt-6 text-left">
                    <label class="block text-xs font-bold text-slate-500 mb-1 ml-1 uppercase">E-POSTA</label>
                    <input type="email" id="forgotEmail" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="eposta@adresiniz.com">
                </div>

                <div class="mt-8 flex gap-3">
                    <button onclick="closeForgotModal()" class="flex-1 px-4 py-3 text-sm font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition">İptal</button>
                    <button onclick="sendResetEmail()" id="forgotSubmitBtn" class="flex-1 px-4 py-3 text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 rounded-xl shadow-lg shadow-blue-500/20 transition">Gönder</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/client-config.js"></script>
    <script src="/KDV_Web/fingerprint.js"></script>
    <script src="/KDV_Web/js/auth.js"></script>
    <script>
        const modal = document.getElementById('forgotModal');

        function openForgotModal() {
            modal.classList.add('modal-active');
        }

        function closeForgotModal() {
            modal.classList.remove('modal-active');
        }

        window.onclick = function(event) {
            if (event.target == modal) closeForgotModal();
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            const eye = document.getElementById('eye-' + id);
            if (input.type === "password") {
                input.type = "text";
                eye.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                eye.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function sendResetEmail() {
            const email = document.getElementById('forgotEmail').value;
            const btn = document.getElementById('forgotSubmitBtn');
            
            if (!email) {
                alert("Lütfen e-posta adresinizi girin.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Gönderiliyor...";

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();

                if (data.success) {
                    alert("Sıfırlama bağlantısı gönderildi. Lütfen mail kutunuzu (ve gereksiz kutusunu) kontrol edin.");
                    closeForgotModal();
                } else {
                    alert("Hata: " + (data.error || "Bilinmeyen hata"));
                }
            } catch (error) {
                alert("Bağlantı hatası: " + error.message);
                console.error("Forgot password error:", error);
            } finally {
                btn.disabled = false;
                btn.innerText = "Gönder";
            }
        }
    </script>
</body>
</html>
